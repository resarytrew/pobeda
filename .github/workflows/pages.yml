name: Публикация «Зачёт Победы» в GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы сайта
        uses: actions/checkout@v4
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5
      - name: Подготовить сайт
        shell: bash
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets _site/assets
      - name: Подготовить артефакт Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
